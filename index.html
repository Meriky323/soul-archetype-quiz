    <style>
:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #26231e;
  background: #eee2cd;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --paper: #f7f0e2;
  --paper-deep: #e9d8bb;
  --ink: #28241e;
  --muted: #746858;
  --line: rgba(58, 48, 38, 0.18);
  --red: #8f3f2e;
  --shadow: 0 20px 70px rgba(60, 43, 24, 0.12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: #eee2cd; }
button, input, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible { outline: 3px solid rgba(143, 63, 46, 0.35); outline-offset: 3px; }

.page-shell {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 12%, rgba(255,255,255,.78), transparent 32%),
    radial-gradient(circle at 86% 84%, rgba(135,88,48,.08), transparent 30%),
    linear-gradient(145deg, #faf4e8 0%, #f2e6d2 48%, #ead8ba 100%);
}

.paper-noise {
  pointer-events: none;
  position: absolute;
  inset: 0;
  opacity: .38;
  mix-blend-mode: multiply;
  background-image:
    repeating-linear-gradient(0deg, rgba(80,60,40,.018) 0, rgba(80,60,40,.018) 1px, transparent 1px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0, rgba(255,255,255,.06) 1px, transparent 1px, transparent 6px);
}

.page-shell::before,
.page-shell::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(72,56,38,.1);
  pointer-events: none;
}
.page-shell::before { width: 520px; height: 520px; right: -260px; top: 8%; }
.page-shell::after { width: 320px; height: 320px; left: -160px; bottom: 6%; }

.topbar, .quiz-header, .result-header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 34px;
}

.brand-mark { display: inline-flex; align-items: center; gap: 12px; font-family: ui-serif, Georgia, serif; font-weight: 700; letter-spacing: .12em; }
.brand-mark svg { width: 44px; height: 44px; color: var(--red); }
.brand-mark.compact svg { width: 31px; height: 31px; }
.brand-mark.compact { font-size: 14px; letter-spacing: .17em; }
.edition, .result-header > span { color: var(--muted); font-size: 12px; letter-spacing: .17em; text-transform: uppercase; }

.hero-grid {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  padding: 70px 34px 74px;
  display: grid;
  grid-template-columns: minmax(0, 1.06fr) minmax(380px, .94fr);
  align-items: center;
  gap: 72px;
}

.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.eyebrow span { width: 32px; height: 1px; background: currentColor; }
.eyebrow.centered { justify-content: center; }
.hero-copy h1 { margin: 24px 0 8px; max-width: 720px; font-family: ui-serif, "Songti SC", SimSun, Georgia, serif; font-weight: 600; font-size: clamp(52px, 7vw, 92px); line-height: .98; letter-spacing: -.045em; }
.hero-copy h1 em { display: block; margin-top: 12px; color: var(--red); font-style: normal; }
.hero-subtitle { margin: 28px 0 0; font-size: clamp(22px, 2.7vw, 34px); font-weight: 700; letter-spacing: .02em; }
.hero-description { max-width: 620px; margin: 22px 0 0; color: var(--muted); font-size: 17px; line-height: 1.85; }
.hero-actions { display: flex; align-items: center; gap: 20px; margin-top: 36px; }

.primary-button {
  border: 0;
  min-height: 58px;
  padding: 0 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #fff9ef;
  background: var(--ink);
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 12px 28px rgba(44,36,28,.18);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.primary-button:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(44,36,28,.22); background: #171511; }
.text-button { border: 0; padding: 10px 4px; background: transparent; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 5px; }
.text-button:disabled { opacity: .35; cursor: not-allowed; }
.trust-line { display: flex; align-items: center; gap: 8px; margin-top: 25px; color: var(--muted); font-size: 13px; }

.hero-orbit { position: relative; min-height: 520px; display: grid; place-items: center; }
.orbit-ring { position: absolute; border: 1px solid rgba(63,50,37,.14); border-radius: 50%; }
.ring-one { width: 440px; height: 440px; animation: rotate 28s linear infinite; }
.ring-two { width: 330px; height: 330px; border-style: dashed; animation: rotate-reverse 22s linear infinite; }
.ring-one::before, .ring-two::before { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--red); top: 22px; left: 48px; }
@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes rotate-reverse { to { transform: rotate(-360deg); } }

.portrait-card {
  position: relative;
  z-index: 2;
  width: 300px;
  min-height: 410px;
  padding: 44px 34px 34px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  background: rgba(255,250,239,.83);
  border: 1px solid rgba(65,48,32,.22);
  box-shadow: var(--shadow);
  transform: rotate(-3deg);
  backdrop-filter: blur(8px);
}
.portrait-card::before { content: ""; position: absolute; inset: 11px; border: 1px solid rgba(143,63,46,.35); pointer-events: none; }
.portrait-card .seal { position: absolute; top: 30px; right: 28px; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff7ea; font-family: ui-serif, Georgia, serif; font-size: 26px; }
.portrait-kicker { margin-bottom: 36px; color: var(--muted); font-size: 10px; letter-spacing: .2em; }
.portrait-card strong { font-family: ui-serif, "Songti SC", SimSun, serif; font-size: 31px; line-height: 1.25; }
.portrait-card small { margin: 7px 0; color: var(--red); font-size: 24px; }
.ink-line { width: 70px; height: 4px; margin: 30px 0 20px; background: var(--red); }
.portrait-card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
.floating-tag { position: absolute; z-index: 3; padding: 10px 14px; border: 1px solid rgba(58,46,34,.2); background: rgba(250,244,233,.86); box-shadow: 0 8px 20px rgba(55,41,27,.08); font-size: 12px; font-weight: 700; backdrop-filter: blur(6px); }
.tag-a { top: 56px; right: 0; transform: rotate(3deg); }
.tag-b { bottom: 70px; left: 0; transform: rotate(-4deg); }
.tag-c { right: 6px; bottom: 18px; transform: rotate(2deg); }

.feature-strip {
  position: relative;
  z-index: 2;
  max-width: 1112px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.feature-strip article { padding: 28px 30px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; border-right: 1px solid var(--line); }
.feature-strip article:last-child { border-right: 0; }
.feature-strip svg { grid-row: 1 / span 2; color: var(--red); }
.feature-strip strong { font-family: ui-serif, Georgia, serif; font-size: 18px; }
.feature-strip span { color: var(--muted); font-size: 13px; }

.sample-results { position: relative; z-index: 1; max-width: 1112px; margin: 0 auto; padding: 100px 0 110px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 70px; }
.section-number { color: var(--red); font-weight: 800; font-size: 12px; letter-spacing: .2em; }
.sample-results h2 { margin: 16px 0 0; font-family: ui-serif, "Songti SC", serif; font-size: clamp(40px, 5vw, 68px); line-height: 1.05; }
.sample-copy { padding-top: 30px; border-top: 1px solid var(--line); }
.sample-copy p { margin: 0 0 24px; color: var(--muted); font-size: 17px; line-height: 1.8; }
.landing-footer, .result-footer { position: relative; z-index: 2; max-width: 1112px; margin: 0 auto; padding: 30px 0 38px; display: flex; justify-content: space-between; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .12em; }

/* Quiz */
.quiz-page { min-height: 100svh; display: flex; flex-direction: column; }
.quiz-header { width: 100%; }
.icon-button { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.22); cursor: pointer; }
.icon-button svg { width: 19px; }
.time-left { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.progress-wrap { position: relative; z-index: 2; width: min(760px, calc(100% - 48px)); margin: 14px auto 0; }
.progress-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.progress-meta strong { color: var(--ink); font-size: 13px; }
.progress-track { height: 3px; margin-top: 12px; background: rgba(61,48,34,.12); overflow: hidden; }
.progress-track span { display: block; height: 100%; background: var(--red); transition: width .4s ease; }

.question-stage { position: relative; z-index: 1; width: min(760px, calc(100% - 48px)); margin: 58px auto 30px; animation: enter-question .42s ease both; }
@keyframes enter-question { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.question-number { width: 56px; height: 56px; display: grid; place-items: center; border: 1px solid rgba(143,63,46,.38); border-radius: 50%; color: var(--red); font-family: ui-serif, Georgia, serif; font-weight: 700; }
.question-stage h1 { margin: 28px 0 12px; font-family: ui-serif, "Songti SC", SimSun, serif; font-size: clamp(30px, 4vw, 46px); line-height: 1.32; font-weight: 600; letter-spacing: -.02em; }
.question-hint { margin: 0; color: var(--muted); font-size: 14px; }
.options-list { margin-top: 34px; display: grid; gap: 12px; }
.option-card { width: 100%; min-height: 74px; padding: 15px 18px; display: grid; grid-template-columns: 42px 1fr 30px; align-items: center; gap: 12px; text-align: left; border: 1px solid rgba(64,50,34,.17); background: rgba(255,251,242,.56); border-radius: 16px; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease; }
.option-card:hover:not(:disabled) { transform: translateX(5px); border-color: rgba(143,63,46,.58); background: rgba(255,252,246,.94); box-shadow: 0 10px 28px rgba(70,47,26,.08); }
.option-card.selected { border-color: var(--red); background: rgba(143,63,46,.08); transform: translateX(5px); }
.option-card:disabled { cursor: default; }
.option-letter { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-family: ui-serif, Georgia, serif; font-weight: 700; color: var(--muted); }
.option-card.selected .option-letter { color: #fffaf2; background: var(--red); border-color: var(--red); }
.option-text { font-size: 15px; line-height: 1.55; }
.option-check { display: grid; place-items: center; color: var(--red); }
.quiz-footer { position: relative; z-index: 2; width: min(760px, calc(100% - 48px)); margin: auto auto 0; padding: 24px 0 28px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }

/* Analyzing */
.analyzing-page { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
.analyzing-page .brand-mark { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); }
.analysis-symbol { position: relative; width: 210px; height: 210px; display: grid; place-items: center; margin-bottom: 42px; }
.analysis-ring { position: absolute; inset: 0; border: 1px solid rgba(86,62,39,.23); border-radius: 50%; animation: rotate 5s linear infinite; }
.analysis-ring.ring-b { inset: 28px; border-style: dashed; animation: rotate-reverse 4s linear infinite; }
.analysis-ring::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--red); top: 20px; left: 42px; box-shadow: 0 0 0 8px rgba(143,63,46,.08); }
.analysis-core { width: 92px; height: 92px; display: grid; place-items: center; border-radius: 50%; background: var(--red); color: white; font-family: ui-serif, Georgia, serif; font-size: 42px; box-shadow: 0 15px 35px rgba(143,63,46,.22); }
.analyzing-page h1 { margin: 20px 0 32px; font-family: ui-serif, "Songti SC", serif; font-size: clamp(38px, 6vw, 68px); line-height: 1.12; font-weight: 600; }
.analysis-steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.analysis-steps span { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; }

/* Result */
.result-page { --accent: #8f3f2e; padding-bottom: 0; }
.result-header { border-bottom: 1px solid var(--line); }
.result-hero { position: relative; z-index: 1; max-width: 1112px; margin: 0 auto; padding: 84px 0 72px; display: grid; grid-template-columns: 1.12fr .88fr; gap: 70px; align-items: center; }
.result-title-block { position: relative; }
.result-seal { position: absolute; right: 8px; top: 0; width: 88px; height: 88px; display: grid; place-items: center; color: #fff8ed; background: var(--accent); border-radius: 50%; font-family: ui-serif, Georgia, serif; font-size: 40px; box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 28%, transparent); }
.result-title-block h1 { margin: 28px 0 8px; font-family: ui-serif, "Songti SC", SimSun, serif; font-size: clamp(54px, 7vw, 88px); font-weight: 600; line-height: 1; letter-spacing: -.04em; }
.result-title-block h2 { margin: 12px 0 0; color: var(--accent); font-size: clamp(24px, 3vw, 38px); line-height: 1.2; }
.result-verdict { max-width: 690px; margin: 28px 0 0; font-family: ui-serif, "Songti SC", serif; font-size: 21px; line-height: 1.65; }
.result-badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
.result-badges span { padding: 10px 14px; border: 1px solid var(--line); background: rgba(255,255,255,.3); border-radius: 999px; color: var(--muted); font-size: 12px; }
.result-badges strong { color: var(--ink); font-size: 15px; }
.radar-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 390px; background: rgba(255,251,243,.46); border: 1px solid var(--line); box-shadow: var(--shadow); }
.radar-chart { width: min(100%, 340px); overflow: visible; color: var(--ink); }
.radar-label { fill: currentColor; font-size: 10px; font-weight: 600; }
.radar-caption { color: var(--muted); font-size: 11px; }

.result-grid { position: relative; z-index: 1; max-width: 1112px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.result-card { padding: 34px; background: rgba(255,251,243,.55); border: 1px solid var(--line); }
.card-index { display: block; margin-bottom: 22px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.portrait-copy-card p { margin: 0; font-family: ui-serif, "Songti SC", serif; font-size: 20px; line-height: 1.85; }
.quote-strip { margin-top: 30px; padding: 18px 20px; border-left: 4px solid var(--accent); background: rgba(255,255,255,.36); color: var(--muted); font-weight: 700; }
.dimension-list { display: grid; gap: 20px; }
.dimension-row > div:first-child { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.dimension-row strong { color: var(--accent); font-size: 18px; }
.dimension-track { height: 7px; margin-top: 9px; overflow: hidden; background: rgba(57,46,34,.1); border-radius: 999px; }
.dimension-track span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.two-column-card { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
.two-column-card > div:first-child { border-right: 1px solid var(--line); padding-right: 60px; }
.result-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.result-card li { position: relative; padding-left: 18px; color: var(--muted); line-height: 1.6; }
.result-card li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.context-card { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.context-card > div { padding-right: 28px; border-right: 1px solid var(--line); }
.context-card > div:last-child { border-right: 0; padding-right: 0; }
.mini-label { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
.context-card p { margin: 12px 0 0; color: var(--muted); line-height: 1.75; }

.secondary-result { position: relative; z-index: 1; max-width: 1112px; margin: 16px auto 0; padding: 28px 34px; display: grid; grid-template-columns: 62px 1fr auto; gap: 22px; align-items: center; border: 1px solid var(--line); background: rgba(51,45,37,.92); color: #fff8ed; }
.secondary-seal { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; font-family: ui-serif, serif; font-size: 26px; }
.secondary-result span { color: rgba(255,248,237,.58); font-size: 11px; letter-spacing: .13em; }
.secondary-result h3 { margin: 7px 0 4px; font-family: ui-serif, "Songti SC", serif; font-size: 22px; }
.secondary-result p { margin: 0; color: rgba(255,248,237,.68); }

.quality-section { position: relative; z-index: 1; max-width: 1112px; margin: 70px auto 0; padding: 30px 0; display: grid; grid-template-columns: .65fr 1.35fr; gap: 40px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.quality-section > div { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 5px 10px; }
.quality-section svg { grid-row: 1 / span 2; color: var(--accent); }
.quality-section span { color: var(--muted); font-size: 12px; }
.quality-section strong { font-family: ui-serif, serif; font-size: 26px; }
.quality-section ul { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.7; }
.quality-section > p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }

.share-zone { position: relative; z-index: 1; max-width: 1112px; margin: 80px auto 0; padding: 48px; display: flex; align-items: center; justify-content: space-between; gap: 40px; background: var(--accent); color: #fff8ed; box-shadow: 0 25px 55px color-mix(in srgb, var(--accent) 20%, transparent); }
.share-zone > div > svg { opacity: .75; }
.share-zone span { display: block; margin-top: 14px; color: rgba(255,248,237,.72); font-size: 12px; letter-spacing: .08em; }
.share-zone h2 { max-width: 680px; margin: 10px 0 0; font-family: ui-serif, "Songti SC", serif; font-size: clamp(28px, 4vw, 43px); line-height: 1.2; }
.share-zone .primary-button { flex-shrink: 0; background: #fff8ed; color: var(--accent); box-shadow: none; }
.share-zone .primary-button:hover { background: white; }

.archetype-browser { position: relative; z-index: 1; max-width: 1112px; margin: 54px auto 0; }
.browser-toggle { width: 100%; padding: 22px 0; display: flex; justify-content: space-between; align-items: center; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; }
.browser-toggle svg { transition: transform .2s ease; }
.browser-toggle svg.rotated { transform: rotate(90deg); }
.archetype-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; animation: enter-question .3s ease both; }
.archetype-grid article { min-height: 190px; padding: 24px; border: 1px solid var(--line); background: rgba(255,251,243,.44); }
.archetype-grid article.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mini-seal { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: white; font-family: ui-serif, serif; }
.archetype-grid span { display: block; margin-top: 20px; color: var(--muted); font-size: 11px; }
.archetype-grid strong { display: block; margin-top: 6px; font-family: ui-serif, "Songti SC", serif; font-size: 18px; }
.archetype-grid p { margin: 14px 0 0; color: var(--accent); font-size: 12px; }
.result-footer { margin-top: 80px; align-items: center; }
.result-footer .restart { display: flex; align-items: center; gap: 7px; }
.result-footer > span { max-width: 620px; text-align: right; line-height: 1.5; letter-spacing: .04em; }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; padding-top: 42px; gap: 20px; }
  .hero-orbit { min-height: 490px; }
  .sample-results, .result-hero { grid-template-columns: 1fr; }
  .sample-results { padding-inline: 34px; }

/* Huashu Design v2 — internet collage × cultural archetype */
:root {
  --night: #080909;
  --gold: #d8ae57;
  --violet: #6655b7;
  --lilac: #eeeaff;
}

.landing.page-shell {
  color: #f4e7c3;
  background:
    radial-gradient(circle at 72% 18%, rgba(216,174,87,.18), transparent 23%),
    radial-gradient(circle at 17% 72%, rgba(102,85,183,.14), transparent 28%),
    linear-gradient(145deg, #080909 0%, #11100e 52%, #211a10 100%);
}
.landing .paper-noise { opacity: .55; mix-blend-mode: screen; }
.landing .brand-mark, .landing .edition { color: #ead09a; }
.landing .eyebrow { color: #d8ae57; }
.landing .hero-copy h1 { color: #fff5d8; text-shadow: 0 6px 34px rgba(216,174,87,.15); }
.landing .hero-copy h1 em { color: #d8ae57; }
.landing .hero-subtitle { color: #d8ae57; }
.landing .hero-description, .landing .trust-line, .landing .feature-strip span, .landing .sample-copy p, .landing-footer { color: rgba(244,231,195,.65); }
.landing .primary-button { color: #090908; background: #d8ae57; box-shadow: 0 15px 40px rgba(216,174,87,.2); }
.landing .primary-button:hover { background: #f4d88f; }
.landing .text-button { color: #ead09a; }
.landing .feature-strip, .landing .feature-strip article, .landing .sample-copy, .landing-footer { border-color: rgba(216,174,87,.2); }
.landing .feature-strip svg, .landing .section-number { color: #d8ae57; }
.landing .sample-results h2, .landing .feature-strip strong { color: #fff4d5; }

.hero-orbit {
  min-height: 600px;
  perspective: 1200px;
}
.preview-card {
  position: absolute;
  width: 310px;
  min-height: 430px;
  padding: 28px;
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  box-shadow: 0 30px 70px rgba(0,0,0,.42);
  isolation: isolate;
}
.preview-card::before {
  content: "";
  position: absolute;
  z-index: -2;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  top: 36px;
  right: -30px;
}
.preview-card::after {
  content: attr(data-seal);
  position: absolute;
  z-index: -1;
  top: 78px;
  right: 48px;
  font: 900 150px/1 ui-serif, "Songti SC", serif;
  opacity: .22;
}
.preview-dark {
  left: 10px;
  top: 45px;
  color: #f8e5b5;
  border: 1px solid rgba(216,174,87,.48);
  background:
    linear-gradient(180deg, rgba(255,255,255,.02), transparent 38%),
    repeating-linear-gradient(-12deg, transparent 0 30px, rgba(216,174,87,.025) 31px 32px),
    #090a09;
  transform: rotate(-7deg) translateZ(12px);
}
.preview-dark::before { background: radial-gradient(circle, #d9ad54 0 48%, rgba(216,174,87,.18) 49% 62%, transparent 63%); }
.preview-dark::after { content: "谋"; color: #d8ae57; }
.preview-light {
  right: -5px;
  bottom: 22px;
  color: #3d3569;
  border: 1px solid rgba(102,85,183,.3);
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.95), transparent 26%),
    linear-gradient(145deg, #fbfaff, #e8e4fb 64%, #f8f3ee);
  transform: rotate(6deg) translateZ(24px);
}
.preview-light::before { background: radial-gradient(circle, rgba(102,85,183,.15) 0 52%, transparent 53%); }
.preview-light::after { content: "清"; color: #6655b7; }
.preview-card .preview-kicker { margin-bottom: auto; font-size: 10px; letter-spacing: .16em; opacity: .72; }
.preview-card b { font: 900 42px/1.05 ui-serif, "Songti SC", serif; }
.preview-card strong { margin-top: 12px; max-width: 250px; font-size: 18px; line-height: 1.35; }
.preview-card em { margin-top: 24px; font: 900 76px/.95 ui-serif, Georgia, serif; font-style: normal; }
.preview-card i { width: fit-content; margin-top: 15px; padding: 9px 12px; font-style: normal; font-size: 12px; font-weight: 800; transform: rotate(-2deg); }
.preview-dark i { color: #17130b; background: #d8ae57; }
.preview-light i { color: #fff; background: #6655b7; }
.landing .floating-tag { border: 1px solid rgba(216,174,87,.32); color: #f3ddb0; background: rgba(8,9,9,.78); }

/* Result art direction */
.meme-result { position: relative; }
.meme-result::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background:
    repeating-linear-gradient(12deg, transparent 0 38px, currentColor 39px 40px),
    radial-gradient(circle at 83% 12%, currentColor 0 1px, transparent 2px);
}
.meme-result.tone-dark {
  --ink: #f8e8ba;
  --muted: rgba(244,229,190,.65);
  --line: rgba(216,174,87,.22);
  color: #f5e7c0;
  background:
    radial-gradient(circle at 74% 15%, rgba(216,174,87,.18), transparent 25%),
    radial-gradient(circle at 10% 68%, rgba(216,174,87,.08), transparent 30%),
    linear-gradient(145deg, #070808 0%, #11110f 58%, #1b160e 100%);
}
.meme-result.tone-light {
  --ink: #30294f;
  --muted: #756d95;
  --line: rgba(102,85,183,.18);
  color: #30294f;
  background:
    radial-gradient(circle at 84% 12%, rgba(102,85,183,.15), transparent 27%),
    radial-gradient(circle at 12% 65%, rgba(242,187,204,.24), transparent 26%),
    linear-gradient(145deg, #fbfaff 0%, #efecfb 56%, #faf5f0 100%);
}
.meme-result .result-header { border-color: var(--line); }
.meme-result.tone-dark .brand-mark, .meme-result.tone-dark .result-header > span { color: #d8ae57; }
.meme-result.tone-light .brand-mark, .meme-result.tone-light .result-header > span { color: #6655b7; }
.meme-result .result-hero {
  max-width: 1180px;
  min-height: 760px;
  padding: 70px 54px;
  border: 1px solid var(--line);
  overflow: hidden;
  background: color-mix(in srgb, currentColor 3%, transparent);
  box-shadow: 0 32px 90px rgba(0,0,0,.12);
}
.meme-result.tone-dark .result-hero { background: rgba(5,6,6,.66); box-shadow: 0 36px 100px rgba(0,0,0,.46); }
.meme-result.tone-light .result-hero { background: rgba(255,255,255,.5); box-shadow: 0 28px 80px rgba(78,62,140,.12); }
.result-title-block { z-index: 2; }
.result-title-block h1 { position: relative; z-index: 3; max-width: 780px; font-size: clamp(68px, 9vw, 122px); letter-spacing: -.065em; }
.result-title-block h2 { position: relative; z-index: 3; max-width: 690px; font-size: clamp(27px, 4vw, 48px); }
.meme-result.tone-dark .result-title-block h2, .meme-result.tone-dark .eyebrow, .meme-result.tone-dark .card-index, .meme-result.tone-dark .mini-label { color: #d8ae57; }
.meme-result.tone-light .result-title-block h2, .meme-result.tone-light .eyebrow, .meme-result.tone-light .card-index, .meme-result.tone-light .mini-label { color: #6655b7; }
.result-figure {
  position: absolute;
  z-index: 1;
  width: 460px;
  height: 460px;
  right: -72px;
  top: -75px;
}
.result-halo {
  position: absolute;
  inset: 28px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 42%, transparent) 0 50%, transparent 51%);
  box-shadow: 0 0 0 30px color-mix(in srgb, var(--accent) 6%, transparent), 0 0 0 62px color-mix(in srgb, var(--accent) 3%, transparent);
}
.abstract-bust {
  position: absolute;
  right: 70px;
  bottom: 35px;
  width: 235px;
  height: 310px;
  display: grid;
  place-items: center;
  color: color-mix(in srgb, var(--accent) 66%, currentColor);
  background:
    radial-gradient(ellipse at 50% 28%, currentColor 0 20%, transparent 21%),
    radial-gradient(ellipse at 50% 82%, currentColor 0 44%, transparent 45%);
  filter: drop-shadow(0 18px 18px rgba(0,0,0,.22));
  opacity: .9;
}
.abstract-bust span { color: inherit; font: 900 120px/1 ui-serif, serif; mix-blend-mode: difference; opacity: .5; }
.result-figure > b { position: absolute; right: 6px; bottom: 12px; font: 900 48px/1 ui-serif, "Songti SC", serif; opacity: .12; writing-mode: vertical-rl; letter-spacing: .15em; }
.meme-result .result-seal { z-index: 4; border: 1px solid color-mix(in srgb, var(--accent) 70%, white); box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 38%, transparent); }
.meme-stickers { position: relative; z-index: 5; min-height: 126px; margin: 24px 0 4px; }
.sticker {
  position: absolute;
  display: inline-flex;
  align-items: center;
  max-width: 300px;
  min-height: 44px;
  padding: 10px 15px;
  font-size: 13px;
  font-weight: 900;
  line-height: 1.25;
  box-shadow: 0 12px 28px rgba(0,0,0,.14);
}
.tone-dark .sticker { color: #11100d; background: #e0ba64; }

.tone-dark .sticker-three { color: #17130b; background: #f4e3b7; }
.tone-light .sticker { color: #312957; background: #fff; border: 1px solid rgba(102,85,183,.18); }
.tone-light .sticker-two { color: #fff; background: #6655b7; }
.tone-light .sticker-three { color: #342d58; background: #eee9ff; }
.sticker-one { left: 0; top: 6px; transform: rotate(-2.5deg); }
.sticker-two { left: 190px; top: 57px; transform: rotate(2deg); }
.sticker-three { left: 462px; top: 18px; transform: rotate(-1deg); }
.meme-result .radar-panel { position: relative; z-index: 3; background: color-mix(in srgb, currentColor 4%, transparent); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.meme-result .result-card, .meme-result .archetype-grid article {
  border-color: var(--line);
  background: color-mix(in srgb, currentColor 4%, transparent);
  backdrop-filter: blur(8px);
}
.meme-result.tone-dark .result-card, .meme-result.tone-dark .archetype-grid article { background: rgba(5,6,6,.64); }
.meme-result.tone-light .result-card, .meme-result.tone-light .archetype-grid article { background: rgba(255,255,255,.56); }
.meme-result .secondary-result { border-color: var(--line); background: color-mix(in srgb, var(--accent) 68%, #111); }
.meme-result .share-zone { overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 60%, white); }
.meme-result .share-zone::after { content: "原"; position: absolute; right: -15px; bottom: -55px; font: 900 180px/1 ui-serif, serif; opacity: .1; }

@media (max-width: 900px) {

  function emptyScores() { return { creativity:0, system:0, curiosity:0, action:0, resilience:0, influence:0, aesthetics:0, autonomy:0 }; }
  function calculateDimensionScores(answers) {
    const deviation = emptyScores(), positiveCapacity = emptyScores(), negativeCapacity = emptyScores();
    questions.forEach((question) => {
      const answer = answers[question.id]; const weight = question.weight ?? 1;
      DIMENSIONS.forEach((dimension) => {
        const values = question.options.map((option) => (option.scores[dimension] ?? 0) * weight);
        const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
        positiveCapacity[dimension] += Math.max(...values) - mean;
        negativeCapacity[dimension] += mean - Math.min(...values);
        if (answer) deviation[dimension] += values[answer.optionIndex] - mean;
      });
    });
    const normalized = emptyScores();
    DIMENSIONS.forEach((dimension) => {
      const value = deviation[dimension];
      const capacity = value >= 0 ? positiveCapacity[dimension] : negativeCapacity[dimension];
      normalized[dimension] = capacity <= 0 ? 50 : Math.round(clamp(50 + 50 * (value / capacity), 0, 100));
    });
    return normalized;
  }
  function normalizedPrimaryValue(question, answerIndex) {
    if (!question.primary) return null;
    const values = question.options.map((option) => option.scores[question.primary] ?? 0);
    const min = Math.min(...values), max = Math.max(...values); if (max === min) return null;
    const value = question.options[answerIndex]?.scores[question.primary] ?? 0;
    const normalized = (value-min)/(max-min); return question.reversePair ? 1-normalized : normalized;
  }
  function calculateConsistency(answers) {
    const grouped = new Map();
    questions.forEach((question) => {
      if (!question.pairId || !answers[question.id]) return;
      const value = normalizedPrimaryValue(question, answers[question.id].optionIndex); if (value === null) return;
      grouped.set(question.pairId, [...(grouped.get(question.pairId) || []), value]);
    });
    const scores = [...grouped.values()].filter((values) => values.length >= 2).map((values) => 1-clamp(Math.abs(values[0]-values[1]),0,1));
    return scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : .72;
  }
  function standardizeProfile(profile) {
    const values = DIMENSIONS.map((key) => profile[key]);
    const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
    const deviation = Math.sqrt(values.reduce((sum, value) => sum + (value - mean) ** 2, 0) / values.length) || 1;
    return values.map((value) => (value - mean) / deviation);
  }
  function similarity(user, archetype) {
    const a = standardizeProfile(user), b = standardizeProfile(archetype.vector);
    const dot = a.reduce((sum, value, index) => sum + value * b[index], 0);
    const cosine = clamp((dot / DIMENSIONS.length + 1) / 2, 0, 1);
    const distance = Math.sqrt(a.reduce((sum, value, index) => sum + (value - b[index]) ** 2, 0));
    const shapeCloseness = 1 - clamp(distance / Math.sqrt(DIMENSIONS.length * 16), 0, 1);
    return cosine * 0.72 + shapeCloseness * 0.28;
  }
  function longestSameChoice(answers) {
    let longest=0,current=0,previous=null;
    questions.forEach((q)=>{const choice=answers[q.id]?.optionIndex;if(choice===undefined)return;if(choice===previous)current+=1;else current=1;previous=choice;longest=Math.max(longest,current);});
    return longest;
  }
  function qualityAssessment(answers,consistency) {
    const times=Object.values(answers).map(a=>a.elapsedMs), completion=Object.keys(answers).length/questions.length;
    const tooFast=times.filter(t=>t>0&&t<850).length, verySlow=times.filter(t=>t>45000).length, streak=longestSameChoice(answers), attentionPassed=answers[24]?.optionIndex===1;
    let confidence=54+completion*16+consistency*21+(attentionPassed?5:-6)-Math.min(9,tooFast*.8)-Math.max(0,streak-6)*1.2-Math.min(4,verySlow*.5);
    confidence=Math.round(clamp(confidence,48,96)); const notes=[];
    if(completion<1)notes.push('仍有题目未完成，结果只反映当前答案。');
    if(!attentionPassed)notes.push('注意力确认题未通过，因此降低了结果置信度。');
    if(tooFast>=5)notes.push('有多道题作答较快，系统降低了置信度而未改写人格分数。');
    if(streak>=8)notes.push('出现连续选择同一位置的情况，可能是习惯，也可能是机械作答。');
    if(consistency<.55)notes.push('跨场景答案存在差异，这也可能表示你在不同环境下表现不同。');
    if(!notes.length)notes.push('作答节奏与跨场景答案较稳定，结果可作为娱乐性自我观察参考。');
    const label=confidence>=88?'高稳定度':confidence>=75?'较稳定':confidence<62?'探索性结果':'可参考';

    return `<svg class="radar-chart" viewBox="0 0 ${size} ${size}" role="img" aria-label="八维人格雷达图">${grids}${axes}<polygon points="${polygon}" fill="${accent}" fill-opacity=".2" stroke="${accent}" stroke-width="2.2"/>${labels}</svg>`;

    document.getElementById('share-button').onclick=handleShare;
    document.getElementById('result-restart').onclick=restartQuiz;
    document.getElementById('browser-toggle').onclick=()=>{state.showAll=!state.showAll;renderResult();};
  }

  async function handleShare() {
    const button=document.getElementById('share-button'); const span=button.querySelector('span');
    try { span.textContent='正在生成…'; const status=await shareOrDownload(state.result); span.textContent=status==='shared'?'已打开分享':'图片已保存'; }
    catch(error){ span.textContent=error?.name==='AbortError'?'生成分享卡':'生成失败，请重试'; }
  }

  function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const chars=[...text];let line='',lineIndex=0;for(let i=0;i<chars.length;i++){const test=line+chars[i];if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y+lineIndex*lineHeight);line=chars[i];lineIndex++;if(lineIndex>=maxLines-1)break;}else line=test;}if(lineIndex<maxLines)ctx.fillText(line,x,y+lineIndex*lineHeight);}
  function loadPortraitImage(archetype){
    return new Promise((resolve,reject)=>{
      const image=new Image();
      image.onload=()=>resolve(image);
      image.onerror=()=>reject(new Error('Portrait rendering failed'));
      image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portraitSvg(archetype));
    });
  }
  async function createShareImage(r){
    const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');
    const dark=true, memes=memeLabels[r.primary.id]||[r.primary.tag,r.primary.shareLine,r.primary.coreArchetype];
    const bg=ctx.createLinearGradient(0,0,1080,1440);
    if(dark){bg.addColorStop(0,'#080909');bg.addColorStop(.55,'#11110f');bg.addColorStop(1,'#1b1710');}
    else{bg.addColorStop(0,'#fbfaff');bg.addColorStop(.55,'#eeeaff');bg.addColorStop(1,'#f7f2ee');}
    ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1440);
    ctx.globalAlpha=.16;for(let i=0;i<1900;i++){ctx.fillStyle=i%3===0?(dark?'#d5a94f':'#6655b7'):(dark?'#fff1c4':'#ffffff');ctx.fillRect(Math.random()*1080,Math.random()*1440,Math.random()*2+.4,Math.random()*2+.4);}ctx.globalAlpha=1;
    const ink=dark?'#f4d58b':'#393064', text=dark?'#fff6dc':'#272044', soft=dark?'#c5aa73':'#756ca4', panel=dark?'rgba(10,10,9,.82)':'rgba(255,255,255,.72)';
    ctx.strokeStyle=dark?'#806229':'#aaa1d5';ctx.lineWidth=2;ctx.strokeRect(42,42,996,1356);
    ctx.fillStyle=ink;ctx.font='700 28px serif';ctx.fillText('灵魂原型  SOUL ARCHETYPE',76,105);
    ctx.fillStyle=soft;ctx.font='500 25px sans-serif';ctx.fillText('互联网给你重新命名了',76,145);
    const portraitImage=await loadPortraitImage(r.primary);
    ctx.save();
    ctx.beginPath();ctx.roundRect(694,178,310,410,22);ctx.clip();
    ctx.drawImage(portraitImage,694,178,310,410);
    const portraitShade=ctx.createLinearGradient(0,178,0,588);portraitShade.addColorStop(.45,'rgba(0,0,0,0)');portraitShade.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=portraitShade;ctx.fillRect(694,178,310,410);
    ctx.restore();ctx.strokeStyle=dark?'#806229':'#aaa1d5';ctx.lineWidth=2;ctx.strokeRect(694,178,310,410);
    ctx.fillStyle=text;ctx.font='900 88px serif';wrapText(ctx,r.primary.historicalName.replace('式原型','型'),76,270,560,96,2);
    ctx.fillStyle=ink;ctx.font='800 45px sans-serif';wrapText(ctx,r.primary.internetName,76,440,560,58,2);
    ctx.fillStyle=soft;ctx.font='500 30px serif';wrapText(ctx,`“${r.primary.verdict}”`,76,565,560,46,3);
    const note=(x,y,w,h,label,rotation=0)=>{ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(rotation);ctx.fillStyle=dark?'#e7c77c':'#ffffff';ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=18;ctx.fillRect(-w/2,-h/2,w,h);ctx.shadowBlur=0;ctx.fillStyle=dark?'#16130d':'#342c5a';ctx.font='700 24px sans-serif';wrapText(ctx,label,-w/2+22,-5,w-44,32,2);ctx.restore();};
    note(650,445,330,78,memes[0],-.04);note(610,545,370,88,memes[1],.035);note(680,655,290,78,memes[2],-.025);
    ctx.fillStyle=ink;ctx.font='900 132px serif';ctx.fillText(`${r.primarySimilarity}%`,76,820);ctx.fillStyle=soft;ctx.font='600 25px sans-serif';ctx.fillText('原型匹配度',82,858);
    const top=DIMENSIONS.map(key=>({key,value:r.scores[key]})).sort((a,b)=>b.value-a.value).slice(0,4);
    top.forEach((item,index)=>{const y=920+index*68;ctx.fillStyle=text;ctx.font='600 25px sans-serif';ctx.fillText(dimensionLabels[item.key],76,y);ctx.fillStyle=dark?'#322b1c':'#d9d4ef';ctx.fillRect(265,y-22,570,18);ctx.fillStyle=ink;ctx.fillRect(265,y-22,570*(item.value/100),18);ctx.fillStyle=soft;ctx.font='700 22px sans-serif';ctx.fillText(String(item.value),865,y);});
    ctx.fillStyle=panel;ctx.strokeStyle=dark?'#5c4825':'#c9c2e7';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(70,1190,940,155,24);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.font='700 26px sans-serif';ctx.fillText('被看穿的你',105,1240);ctx.fillStyle=text;ctx.font='500 25px sans-serif';wrapText(ctx,r.primary.shareLine,105,1282,820,36,2);
    ctx.fillStyle=soft;ctx.font='500 21px sans-serif';ctx.fillText(`${r.primary.tag} · ${r.qualityLabel}`,76,1390);ctx.textAlign='right';ctx.fillText('12 种灵魂原型，找到属于你的那一个',1000,1390);ctx.textAlign='left';
    return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Image generation failed')),'image/png'));
  }
  async function shareOrDownload(r){const blob=await createShareImage(r),file=new File([blob],`灵魂原型-${r.primary.internetName}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:'我的灵魂原型',text:`我的结果是「${r.primary.internetName}」`,files:[file]});return'shared';}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return'downloaded';}

  function restartQuiz() { clear(); state.answers={}; state.currentIndex=0; state.result=null; state.screen='landing'; state.showAll=false; render(); scrollTop(); }

  render();
})();

</script>
